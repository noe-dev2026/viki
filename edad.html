<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mayor de edad</title>
</head>
<body>

<script>

    let edad = parseInt(prompt("Introduce tu edad:"));

    if (edad >= 18) {
        alert("¡Eres mayor de edad! Ya puedes votar.");
    } else {
        alert("Eres menor de edad, todavía no puedes votar.");
    }

</script>
